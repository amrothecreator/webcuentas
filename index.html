<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Control de Cuotas</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #333; color: white; }
        input, button { padding: 10px; margin: 5px; }
        .admin-btn { background: green; color: white; border: none; cursor: pointer; }

        /* ESTILOS DEL POP-UP (MODAL) */
        .modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5); /* Fondo oscuro */
        }
        .modal-contenido {
            background-color: #fefefe;
            margin: 10% auto;
            padding: 20px;
            border-radius: 10px;
            width: 50%;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            position: relative;
        }
        .cerrar {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .cerrar:hover, .cerrar:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        /* Lista dentro del modal */
        .lista-meses { list-style: none; padding: 0; }
        .lista-meses li { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>Control de Cuotas (Marzo - Octubre)</h1>
    <input type="text" id="buscador" placeholder="Buscar persona..." onkeyup="filtrar()">
    <button onclick="loginAdmin()">Soy Admin</button>
    
    <table id="tabla">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Pagados</th>
                <th>Pendientes</th>
                <th>Deuda Total ($)</th>
                <th>Detalle</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
    </table>

    <!-- ESTRUCTURA DEL POP-UP -->
    <div id="miModal" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" onclick="cerrarModal()">&times;</span>
            <div id="detalle-persona"></div>
        </div>
    </div>

    <script>
        let esAdmin = false;
        let datosGlobales = {};

        async function cargarDatos() {
            const respuesta = await fetch('/api/datos');
            datosGlobales = await respuesta.json();
            renderTabla();
        }

        function renderTabla() {
            const cuerpo = document.getElementById('cuerpo-tabla');
            cuerpo.innerHTML = '';
            for (const [nombre, meses] of Object.entries(datosGlobales)) {
                let pagados = 0, pendientes = 0, deuda = 0;
                for (const [mes, info] of Object.entries(meses)) {
                    if (info.estado === 'PAGADO') pagados++;
                    else pendientes++;
                    deuda += info.deuda;
                }
                cuerpo.innerHTML += `
                    <tr>
                        <td>${nombre}</td>
                        <td>${pagados}</td>
                        <td>${pendientes}</td>
                        <td>$${deuda}</td>
                        <td><button onclick="verDetalle('${nombre}')">Ver</button></td>
                    </tr>
                `;
            }
        }

        // Función para abrir el modal
        function verDetalle(nombre) {
            const meses = datosGlobales[nombre];
            let html = `<h2>${nombre}</h2><ul class="lista-meses">`;
            for (const [mes, info] of Object.entries(meses)) {
                const estado = info.estado === 'PAGADO' ? '✅ Pagado' : '❌ Pendiente';
                let extraHTML = info.extra > 0 ? ` (Extra $${info.extra})` : '';
                let deudaHTML = info.deuda > 0 ? ` (Debe $${info.deuda})` : '';
                
                // Mostrar método si está pagado
                let metodoHTML = info.estado === 'PAGADO' && info.metodo ? ` (${info.metodo})` : '';

                html += `<li>${mes.toUpperCase()}: ${estado}${metodoHTML}${extraHTML}${deudaHTML}`;
                if (esAdmin && info.estado !== 'PAGADO') {
                    html += ` <button class="admin-btn" onclick="marcarPagado('${nombre}', '${mes}')">Marcar Pagado</button>`;
                }
                html += `</li>`;
            }
            html += `</ul>`;
            
            document.getElementById('detalle-persona').innerHTML = html;
            document.getElementById('miModal').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('miModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('miModal');
            if (event.target == modal) modal.style.display = 'none';
        }

        // Validación real de contraseña en el servidor
        async function loginAdmin() {
            const pass = prompt("Contraseña de administrador:");
            if (!pass) return;

            const respuesta = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(pass)
            });

            if (respuesta.ok) {
                esAdmin = true;
                alert("Modo administrador activado. Ahora puedes marcar pagos.");
                renderTabla();
            } else {
                alert("Contraseña incorrecta. No tienes permisos de administrador.");
                esAdmin = false;
                renderTabla();
            }
        }

        async function marcarPagado(nombre, mes) {
            const pass = prompt("Confirma tu contraseña de admin para modificar:");
            if (!pass) return;

            // Preguntar el método de pago
            const esTransferencia = confirm("¿El pago fue por transferencia?\n\nAceptar = Transferencia\nCancelar = Efectivo");
            const metodo = esTransferencia ? "transferencia" : "efectivo";

            const respuesta = await fetch('/api/marcar_pagado', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nombre, mes, password: pass, metodo })
            });

            if (respuesta.ok) {
                alert("¡Pago registrado en Google Sheets!");
                cerrarModal();
                cargarDatos();
            } else {
                alert("Error: Contraseña incorrecta o persona no encontrada.");
            }
        }

        function filtrar() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filas = document.querySelectorAll('#cuerpo-tabla tr');
            filas.forEach(fila => {
                const nombre = fila.cells[0].textContent.toLowerCase();
                fila.style.display = nombre.includes(texto) ? '' : 'none';
            });
        }

        cargarDatos();
    </script>
</body>
</html>
